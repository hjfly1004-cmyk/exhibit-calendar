name: 전시 정보 갱신 및 배포

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 전시 정보 수집
        continue-on-error: true
        run: node scripts/collect.mjs
        env:
          CULTURE_API_KEY: ${{ secrets.CULTURE_API_KEY }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
      - name: 수집 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/exhibitions.json
          git diff --cached --quiet || (git commit -m "전시 정보 갱신" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
